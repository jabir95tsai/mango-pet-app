<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mango Pet · iPhone preview</title>
<!--
  WEB PREVIEW ONLY — iPhone device frame for the iOS app's browser preview.
  Open http://localhost:8081/iphone.html while `npm run web -w apps/ios` runs.
  The app runs in the iframe at iPhone 15/16 size (393×852); the frame's
  data-device="iphone" makes the app report real safe-area insets
  (web-preview/device-mode.js). See docs/features/ios-web-preview.md.
  Query: ?glass=0 (iOS < 26 notched tab bar), ?path=/feed (start route).
-->
<style>
  :root {
    --page: #1b1b1d;
    --page-2: #2a2a2e;
    --ink: #e9e9ec;
    --ink-2: #9a9aa2;
    --body: #2c2c2f;
    --screen-w: 393px;
    --screen-h: 852px;
    --bezel: 12px;
    --screen-r: 55px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(1200px 800px at 50% 30%, var(--page-2), var(--page));
    color: var(--ink);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .stage { transform-origin: center center; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .device {
    position: relative;
    width: calc(var(--screen-w) + var(--bezel) * 2);
    height: calc(var(--screen-h) + var(--bezel) * 2);
    padding: var(--bezel);
    border-radius: calc(var(--screen-r) + var(--bezel));
    background: #0b0b0c;
    box-shadow:
      0 0 0 2px #4a4a4f,
      0 0 0 4px #1a1a1c,
      0 30px 80px rgba(0, 0, 0, 0.55);
  }
  /* side buttons */
  .device::before, .device::after {
    content: ""; position: absolute; width: 4px; border-radius: 2px; background: #3a3a3e;
  }
  .device::before { left: -6px; top: 180px; height: 64px; box-shadow: 0 84px 0 #3a3a3e; }
  .device::after { right: -6px; top: 230px; height: 96px; }
  .screen {
    position: relative; width: var(--screen-w); height: var(--screen-h);
    border-radius: var(--screen-r); overflow: hidden; background: #fbf1dd;
  }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  .overlay { position: absolute; inset: 0; pointer-events: none; }
  .island {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 126px; height: 37px; border-radius: 20px; background: #000;
  }
  .status {
    position: absolute; top: 0; left: 0; right: 0; height: 54px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 30px 0 46px; color: #000;
    font: 600 17px/1 -apple-system, "SF Pro Text", "Segoe UI Semibold", system-ui, sans-serif;
    letter-spacing: -0.2px;
  }
  .status .right { display: flex; align-items: center; gap: 6px; }
  .home {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px; border-radius: 3px; background: #000;
  }
  .bar { display: flex; gap: 14px; align-items: center; color: var(--ink-2); }
  .bar a, .bar button {
    color: var(--ink); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px; padding: 6px 12px; font: inherit; cursor: pointer; text-decoration: none;
  }
  .bar a:hover, .bar button:hover { background: rgba(255,255,255,0.16); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="device">
      <div class="screen">
        <iframe id="app" title="Mango Pet" data-device="iphone"></iframe>
        <div class="overlay" aria-hidden="true">
          <div class="status">
            <span id="clock">9:41</span>
            <span class="right">
              <!-- cellular -->
              <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
              <!-- wifi -->
              <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .4 10.4 10.4 0 0 0 .8 3.3L2 4.6a8.6 8.6 0 0 1 6-2.4Zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.3-1.3A6.6 6.6 0 0 0 8 4a6.6 6.6 0 0 0-4.7 1.8l1.3 1.3A4.8 4.8 0 0 1 8 5.8Zm0 3.6c.4 0 .7.1 1 .4L8 11.7 7 9.8c.3-.3.6-.4 1-.4Z"/></svg>
              <!-- battery -->
              <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="20" height="9" rx="2"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" opacity="0.5"/></svg>
            </span>
          </div>
          <div class="island"></div>
          <div class="home"></div>
        </div>
      </div>
    </div>
    <div class="bar">
      <span>iPhone 15 / 16 · 393×852</span>
      <a id="glassToggle" href="#"></a>
      <button id="reload" type="button">重新載入</button>
      <a id="bare" href="/" target="_blank" rel="noopener">無外框開啟</a>
    </div>
  </div>
<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var glassOff = params.get("glass") === "0";
    var startPath = params.get("path") || "/";
    var frame = document.getElementById("app");
    if (glassOff) frame.dataset.glass = "0";
    frame.src = startPath.charAt(0) === "/" ? startPath : "/" + startPath;

    var toggle = document.getElementById("glassToggle");
    toggle.textContent = glassOff ? "切換：Liquid Glass（iOS 26）" : "切換：凹口 tab bar（iOS 26 以前）";
    toggle.addEventListener("click", function (e) {
      e.preventDefault();
      params.set("glass", glassOff ? "1" : "0");
      location.search = params.toString();
    });
    document.getElementById("reload").addEventListener("click", function () {
      frame.contentWindow.location.reload();
    });

    // Hide desktop scrollbars inside the app, like iOS overlay scrollbars.
    frame.addEventListener("load", function () {
      try {
        var doc = frame.contentDocument;
        var style = doc.createElement("style");
        style.textContent = "*{scrollbar-width:none}*::-webkit-scrollbar{display:none}";
        doc.head.appendChild(style);
      } catch (e) {}
    });

    // Live clock, iOS style (no leading zero on the hour).
    function tick() {
      var d = new Date();
      var h = d.getHours() % 12 || 12;
      var m = String(d.getMinutes()).padStart(2, "0");
      document.getElementById("clock").textContent = h + ":" + m;
    }
    tick();
    setInterval(tick, 15000);

    // Fit the device to the window.
    var stage = document.getElementById("stage");
    function fit() {
      stage.style.transform = "none";
      var r = stage.getBoundingClientRect();
      var s = Math.min(1, (innerHeight - 24) / r.height, (innerWidth - 24) / r.width);
      stage.style.transform = "scale(" + s + ")";
    }
    addEventListener("resize", fit);
    fit();
  })();
</script>
</body>
</html>
